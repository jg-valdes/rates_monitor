services:

  # One low-footprint container: Gunicorn plus one guarded APScheduler thread.
  web:
    build: .
    image: rates_app:web
    container_name: rates_web
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - data:/app/data
    ports:
      # Bound to localhost only so the port is not exposed directly to the
      # internet. A reverse proxy (e.g. Caddy) running on the host reaches
      # the app at localhost:8003.
      - "8003:8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/login/', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  data:   # persistent SQLite database
