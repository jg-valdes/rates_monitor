<div>
  <label for="{{ field.id_for_label }}" class="block text-xs text-gray-500 mb-1.5">{{ field.label }}</label>
  <div class="relative{% if prefix %} money-input{% endif %}">
    {% if prefix %}<span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-sm font-medium text-gray-500">{{ prefix }}</span>{% endif %}
    {{ field }}
  </div>
  {% for error in field.errors %}<p class="text-xs text-red-400 mt-1">{{ error }}</p>{% endfor %}
</div>
